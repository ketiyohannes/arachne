[project]
name = "arachne"
version = "1.0.0"
description = "One CLI for all your devices: run commands, move files, drive desktops and watch everything, over your Tailscale network"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["psutil>=5.9"]

[project.scripts]
arachne = "arachne.cli:main_exit"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arachne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
